name: validate-profile

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - README.md
      - assets/**
      - scripts/generate_profile.py
      - .github/workflows/update-profile.yml
  pull_request:
    paths:
      - README.md
      - assets/**
      - scripts/generate_profile.py
      - .github/workflows/update-profile.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Generate profile illustrations
        run: python scripts/generate_profile.py
      - name: Check SVGs and README image paths
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET
          for path in Path("assets").rglob("*.svg"):
              ET.parse(path)
          for path in re.findall(r'(?:src|srcset)="(assets/[^" ]+)"', Path("README.md").read_text()):
              if not Path(path).is_file():
                  raise SystemExit(f"Missing image: {path}")
          print("SVGs and README image paths are valid")
          PY
      - name: Check generated illustrations are committed
        run: git diff --exit-code -- assets
