<title id="t">Zayd Zaari — small systems with hard edges</title>
<desc id="d">Hero banner. Zayd Zaari, student developer in Morocco: agent tooling, control planes, local inference and applied research. A diagram shows six projects inside a trust boundary with one authenticated way in and one outbound-only way out.</desc>
<style>
  @keyframes blink { 0%,49% { opacity:1 } 50%,100% { opacity:0 } }
  @keyframes pulse { 0% { transform:scale(1); opacity:.6 } 100% { transform:scale(2.8); opacity:0 } }
  .cursor { animation: blink 1.1s steps(1) infinite }
  .pulse  { transform-box:fill-box; transform-origin:center; animation: pulse 2.6s ease-out infinite }
  @media (prefers-reduced-motion: reduce) { .cursor, .pulse { animation: none } }
</style>
