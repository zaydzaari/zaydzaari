<svg xmlns="http://www.w3.org/2000/svg" width="960" height="168" viewBox="0 0 960 168" role="img" aria-labelledby="title desc">
<title id="title">LinkScribe pipeline</title>
<desc id="desc">A media URL enters a FastAPI queue, audio is processed locally, and English text is returned to an AI agent. Moving dots illustrate the flow, not live job status.</desc>
<style>
.packet{opacity:0;animation:signal 8s ease-in-out infinite}
.second{animation-delay:3s}
@keyframes signal{0%,14%{opacity:0;transform:translateX(0)}22%{opacity:.85}40%{opacity:0;transform:translateX(18px)}100%{opacity:0;transform:translateX(18px)}}
@media(prefers-reduced-motion:reduce){.packet{animation:none;opacity:0}}
</style>
<rect x="8" y="8" width="294" height="144" rx="10" fill="#161b22" stroke="#30363d"/>
<rect x="8" y="24" width="3" height="112" rx="1.5" fill="#82aaff"/>
<text x="30" y="68" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#f0f6fc">Media URL</text>
<text x="30" y="107" font-family="Arial,sans-serif" font-size="22" fill="#b1bac4">FastAPI queue</text>
<path d="M304 80h20m-5-5 5 5-5 5" fill="none" stroke="#30363d" stroke-width="2"/>
<circle class="packet " cx="304" cy="80" r="3" fill="#82aaff"/>
<rect x="328" y="8" width="294" height="144" rx="10" fill="#161b22" stroke="#30363d"/>
<rect x="328" y="24" width="3" height="112" rx="1.5" fill="#82aaff"/>
<text x="350" y="68" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#f0f6fc">Local inference</text>
<text x="350" y="107" font-family="Arial,sans-serif" font-size="22" fill="#b1bac4">FFmpeg + whisper.cpp</text>
<path d="M624 80h20m-5-5 5 5-5 5" fill="none" stroke="#30363d" stroke-width="2"/>
<circle class="packet second" cx="624" cy="80" r="3" fill="#82aaff"/>
<rect x="648" y="8" width="294" height="144" rx="10" fill="#161b22" stroke="#30363d"/>
<rect x="648" y="24" width="3" height="112" rx="1.5" fill="#82aaff"/>
<text x="670" y="68" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#f0f6fc">English text</text>
<text x="670" y="107" font-family="Arial,sans-serif" font-size="22" fill="#b1bac4">For the calling agent</text>
</svg>
