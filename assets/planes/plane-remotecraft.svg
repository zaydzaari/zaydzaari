<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="336" viewBox="0 0 1280 336" role="img" aria-labelledby="t d">
<title id="t">RemoteCraft — Plane 03 · Server Control</title>
<desc id="d">RemoteCraft (ALPHA). Runs Vanilla Minecraft servers on a Linux VPS from a web dashboard, without handing anyone a terminal. Pipeline: dashboard → FastAPI → validated ops → SSH + known_hosts → screen · java. Boundaries: no general-purpose shell, ever; unknown SSH hosts rejected; every JAR checked against Mojang&#x27;s SHA-1. Stack: Python · FastAPI · Paramiko · Linux · GNU Screen · Bash.</desc>
<style>
  @keyframes blink { 0%,49% { opacity:1 } 50%,100% { opacity:0 } }
  @keyframes pulse { 0% { transform:scale(1); opacity:.6 } 100% { transform:scale(2.8); opacity:0 } }
  .cursor { animation: blink 1.1s steps(1) infinite }
  .pulse  { transform-box:fill-box; transform-origin:center; animation: pulse 2.6s ease-out infinite }
  @media (prefers-reduced-motion: reduce) { .cursor, .pulse { animation: none } }
</style>
