<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="336" viewBox="0 0 1280 336" role="img" aria-labelledby="t d">
<title id="t">HomePC — Plane 02 · Device Control</title>
<desc id="d">HomePC (v2 · PRIVATE TEST). Turns a Windows PC into Google Home switches without opening a single inbound port on the machine. Pipeline: Google Home → CF Worker → Durable Object → .NET agent → action registry. Boundaries: no inbound port, no remote shell; a fixed allow-list of actions; power actions disabled by default. Stack: C# · .NET 8 · TypeScript · Cloudflare Workers · OAuth 2.0 · DPAPI.</desc>
