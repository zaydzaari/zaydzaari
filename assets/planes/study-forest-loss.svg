<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="384" viewBox="0 0 1280 384" role="img" aria-labelledby="t d">
<title id="t">Field study — geographic diversity and spectral modality</title>
<desc id="d">Under a fixed data budget, does multispectral Sentinel-2 keep its edge over RGB as forest-loss models train on more regions of the Brazilian Amazon? 107 configurations, 642 models trained, 2,568 zero-shot evaluations, 48 patches per model, fixed. Result: F1 interaction slope +0.018 per doubling, 95% interval −0.017 to +0.058. No clear evidence the advantage changes with region count. Status: manuscript in preparation.</desc>
