<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="336" viewBox="0 0 1280 336" role="img" aria-labelledby="t d">
<title id="t">LinkScribe — Plane 01 · Agent Infrastructure</title>
<desc id="d">LinkScribe (RELEASED · v0.1.2). Hands coding agents an English transcript of a public YouTube, TikTok or Instagram link. Transcription runs locally on a 2-core ARM VPS. Pipeline: agent → FastAPI queue → yt-dlp → FFmpeg 16 kHz → whisper.cpp. Boundaries: one worker, so no job can starve the server; no LLM runs on the VPS; media deleted after every job. Stack: Python · FastAPI · SQLite · whisper.cpp · systemd · Nginx · ARM64.</desc>
<style>
  @keyframes blink { 0%,49% { opacity:1 } 50%,100% { opacity:0 } }
  @keyframes pulse { 0% { transform:scale(1); opacity:.6 } 100% { transform:scale(2.8); opacity:0 } }
  .cursor { animation: blink 1.1s steps(1) infinite }
  .pulse  { transform-box:fill-box; transform-origin:center; animation: pulse 2.6s ease-out infinite }
  @media (prefers-reduced-motion: reduce) { .cursor, .pulse { animation: none } }
</style>
