<title id="t">Toolchain</title>
<desc id="d">Tools grouped by use, each backed by repositories: BUILD: Python · TypeScript · JavaScript · C# / .NET 8. SERVE: FastAPI · Express · SQLite job queues · WebSockets · Workers + Durable Objects. INFER: whisper.cpp · FFmpeg · yt-dlp · PyTorch · Gemini / OpenRouter. GUARD: bearer tokens · OAuth 2.0 · SSH known_hosts · DPAPI · rate limits · checksums. RUN: Linux · ARM64 · systemd · Nginx + certbot · Vercel. PROVE: pytest · Vitest · GitHub Actions CI · fixed seeds.</desc>
<style>
  @keyframes blink { 0%,49% { opacity:1 } 50%,100% { opacity:0 } }
  @keyframes pulse { 0% { transform:scale(1); opacity:.6 } 100% { transform:scale(2.8); opacity:0 } }
  .cursor { animation: blink 1.1s steps(1) infinite }
  .pulse  { transform-box:fill-box; transform-origin:center; animation: pulse 2.6s ease-out infinite }
  @media (prefers-reduced-motion: reduce) { .cursor, .pulse { animation: none } }
</style>
