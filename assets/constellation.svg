<title id="t">Project constellation</title>
<desc id="d">Network of Zayd&#x27;s original repositories. Angle groups them by theme (agent infrastructure, control planes, research, lab, product); distance from the centre is age; bright nodes were pushed recently. Links name what two projects share: linkscribe and RemoteCraft: FastAPI; RemoteCraft and HomePC: allow-listed actions; HomePC and trident-fps: WebSockets; trident-fps and studymaster-ai: React; linkscribe and geographic-training-diversity-forest-loss: model inference; studymaster-ai and linkscribe: LLM tooling.</desc>
<style>
  @keyframes blink { 0%,49% { opacity:1 } 50%,100% { opacity:0 } }
  @keyframes pulse { 0% { transform:scale(1); opacity:.6 } 100% { transform:scale(2.8); opacity:0 } }
  .cursor { animation: blink 1.1s steps(1) infinite }
  .pulse  { transform-box:fill-box; transform-origin:center; animation: pulse 2.6s ease-out infinite }
  @media (prefers-reduced-motion: reduce) { .cursor, .pulse { animation: none } }
</style>
